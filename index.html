<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط و منصات رافع | RAF</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 26px;
            color: #38bdf8;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .section-title {
            text-align: right;
            font-size: 16px;
            color: #cbd5e1;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .link-button {
            display: block;
            background: rgba(56, 189, 248, 0.1);
            color: #e2e8f0;
            text-decoration: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .link-button:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>رافع | RAF</h1>
        <p class="subtitle">منصتي الشاملة للألعاب، المحاكيات، والمحتوى التقني</p>

        <!-- قسم الألعاب والمحاكيات -->
        <div class="section-title">🎮 الألعاب والمحاكيات</div>
        <a href="https://aethersx2.en.divxland.org/" target="_blank" class="link-button">تحميل محاكي AetherSX2</a>
        <a href="https://romsfun.com/roms/playstation-2/?q=GOD+OF+WAR" target="_blank" class="link-button">تحميل ألعاب PS2 (God of War)</a>

        <!-- قسم التواصل والمنصات -->
        <div class="section-title">🌐 منصات التواصل والمحتوى</div>
        <a href="https://github.com/rafealansary752-a11y/rafe-games" target="_blank" class="link-button">موقع GitHub Pages</a>
        <a href="https://creators.sa/raf1111" target="_blank" class="link-button">صفحة Creators SA الرئيسية</a>

        <div class="footer">
            جميع الحقوق محفوظة © 2026 jiuvley
        </div>
    </div>

</body>
</html>
