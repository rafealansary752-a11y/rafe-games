<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط و منصات رافع | RAF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #1a2238);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .profile-card {
            width: 100%;
            max-width: 500px;
            background: rgba(26, 34, 56, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .avatar-placeholder {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 5px;
        }
        p.handle {
            color: #38bdf8;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 5px;
        }
        .links-container::-webkit-scrollbar {
            width: 5px;
        }
        .links-container::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 10px;
        }
        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .link-item:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-placeholder">R</div>
        <h1>رافع | RAF</h1>
        <p class="handle">@jiuvley</p>

        <div class="links-container">
            <!-- الروابط الجديدة -->
            <a href="https://romsfun.com/roms/playstation-2/?q=GOD+OF+WAR" target="_blank" class="link-item">🎮 موقع ألعاب PS2</a>
            <a href="https://aethersx2.en.divxland.org/" target="_blank" class="link-item">⚡ تحميل محاكي AetherSX2</a>

            <!-- الروابط الأساسية السابقة كاملة بدون نقص -->
            <a href="#" target="_blank" class="link-item">💻 مكتبة تحميل ألعاب PC</a>
            <a href="#" target="_blank" class="link-item">⚙️ محاكي Winlator</a>
            <a href="#" target="_blank" class="link-item">🕹️ محاكي GameHub</a>
            <a href="#" target="_blank" class="link-item">🔮 محاكي Eden وملحقاته</a>
            <a href="https://github.com/rafealansary752-a11y/rafe-games" target="_blank" class="link-item">📂 مستودع GitHub Pages</a>
            <a href="https://creators.sa/raf1111" target="_blank" class="link-item">🚀 صفحة Creators SA</a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة © 2026 jiuvley
        </div>
    </div>

</body>
</html>
